name: Deploy App to EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLUSTER_NAME: product-assistant-cluster-latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ✅ Check cluster
      - name: Check if EKS Cluster exists
        run: |
          if ! aws eks describe-cluster --name $CLUSTER_NAME --region ${{ secrets.AWS_REGION }}; then
            echo "EKS Cluster not found! Run infra workflow first."
            exit 1
          fi

      # ✅ Login ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ✅ Generate tag
      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV
        
      - name: Final Debug
        run: |
          echo "REGISTRY=${{ secrets.ECR_REGISTRY }}"
          echo "REPOSITORY=${{ secrets.ECR_REPOSITORY }}"

      # ✅ Build & Push
      - name: Build and Push Docker image
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # ✅ kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3        

      # ✅ kubeconfig
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $CLUSTER_NAME \
            --region ${{ secrets.AWS_REGION }}

      # ✅ Secrets
      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic product-assistant-secrets \
            --from-literal=GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --from-literal=ASTRA_DB_API_ENDPOINT=${{ secrets.ASTRA_DB_API_ENDPOINT }} \
            --from-literal=ASTRA_DB_APPLICATION_TOKEN=${{ secrets.ASTRA_DB_APPLICATION_TOKEN }} \
            --from-literal=ASTRA_DB_KEYSPACE=${{ secrets.ASTRA_DB_KEYSPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ✅ Deploy
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8/deployment.yaml
          kubectl apply -f k8/service.yaml

      # ✅ Update image
      - name: Patch deployment
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          kubectl set image deployment/product-assistant product-assistant=$REGISTRY/$REPOSITORY:$IMAGE_TAG

      # ✅ Verify
      - name: Verify Deployment
        run: kubectl rollout status deployment/product-assistant --timeout=120s

      # ✅ Service output
      - name: Get Service Info
        run: kubectl get svc product-assistant-service -o wide