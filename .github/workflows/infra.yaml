name: Provision Infra (EKS + ECR)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLUSTER_NAME: product-assistant-cluster-latest

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔍 Debug files
      - name: Check repository files
        run: ls -R

      # 🔐 AWS Login
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 🔍 Confirm identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🧹 CLEANUP (IMPORTANT)
      - name: Delete old stack (if exists)
        run: |
          aws cloudformation delete-stack \
            --stack-name product-assistant-cluster || true

          aws cloudformation wait stack-delete-complete \
            --stack-name product-assistant-cluster || true

      # 🔍 Validate template
      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/eks-with-ecr.yaml

      # 🚀 DEPLOY STACK (FINAL FIX)
      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name product-assistant-cluster \
            --template-file infra/eks-with-ecr.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ secrets.AWS_REGION }} \
            --no-fail-on-empty-changeset

      # ⏳ Wait for completion
      - name: Wait for Stack Creation
        run: |
          aws cloudformation wait stack-create-complete \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Show stack status
      - name: Check Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Debug events (VERY IMPORTANT if failure)
      - name: Get Stack Events
        run: |
          aws cloudformation describe-stack-events \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}