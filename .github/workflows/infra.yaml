name: Provision Infra (EKS + ECR)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔍 Debug files
      - name: Check repository files
        run: ls -R

      # 🔐 AWS Login
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 🔍 Confirm identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🧹 CLEANUP (IMPORTANT)
      - name: Delete old stack (if exists)
        run: |
          aws cloudformation delete-stack \
            --stack-name product-assistant-cluster || true

          aws cloudformation wait stack-delete-complete \
            --stack-name product-assistant-cluster || true

      # 🔍 Validate template
      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/eks-with-ecr.yaml

      # 🚨 CREATE CHANGE SET (DEBUG MODE)
      - name: Create Change Set
        run: |
          aws cloudformation create-change-set \
            --stack-name product-assistant-cluster \
            --template-body file://infra/eks-with-ecr.yaml \
            --change-set-name debug-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ secrets.AWS_REGION }}

      # ⏳ Wait (do NOT fail immediately)
      - name: Wait for Change Set
        run: |
          aws cloudformation wait change-set-create-complete \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }} || true

      # 🔥 SHOW REAL ERROR (MOST IMPORTANT)
      - name: Describe Change Set (REAL ERROR)
        run: |
          aws cloudformation describe-change-set \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }}

      # 🚀 EXECUTE ONLY IF SUCCESS
      - name: Execute Change Set
        run: |
          aws cloudformation execute-change-set \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Monitor stack
      - name: Wait for Stack Creation
        run: |
          aws cloudformation wait stack-create-complete \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Final status
      - name: Get Stack Events
        run: |
          aws cloudformation describe-stack-events \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}