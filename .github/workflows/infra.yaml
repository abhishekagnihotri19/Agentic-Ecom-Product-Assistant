name: Provision Infra (EKS + ECR)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔍 Debug files
      - name: Check repository files
        run: ls -R

      # 🔐 AWS Login
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 🔍 Confirm identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🧹 CLEANUP
      - name: Delete old stack (if exists)
        run: |
          aws cloudformation delete-stack \
            --stack-name product-assistant-cluster || true

          aws cloudformation wait stack-delete-complete \
            --stack-name product-assistant-cluster || true

      # 🔍 Validate template
      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/eks-with-ecr.yaml

      # 🚨 CREATE CHANGE SET
      - name: Create Change Set
        run: |
          aws cloudformation create-change-set \
            --stack-name product-assistant-cluster \
            --template-body file://infra/eks-with-ecr.yaml \
            --change-set-name debug-changeset \
            --change-set-type CREATE \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ secrets.AWS_REGION }}

      # ⏳ Wait (allow failure)
      - name: Wait for Change Set
        run: |
          aws cloudformation wait change-set-create-complete \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }} || true

      # 🔥 SHOW REAL ERROR
      - name: Describe Change Set (REAL ERROR)
        id: describe_changeset
        run: |
          aws cloudformation describe-change-set \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }} \
            > changeset.json

          cat changeset.json

      # 🚀 EXECUTE ONLY IF SUCCESS
      - name: Execute Change Set
        if: contains(steps.describe_changeset.outputs.stdout, 'CREATE_COMPLETE')
        run: |
          aws cloudformation execute-change-set \
            --stack-name product-assistant-cluster \
            --change-set-name debug-changeset \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Wait for completion (only if executed)
      - name: Wait for Stack Creation
        if: contains(steps.describe_changeset.outputs.stdout, 'CREATE_COMPLETE')
        run: |
          aws cloudformation wait stack-create-complete \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}

      # 📊 Final events
      - name: Get Stack Events
        run: |
          aws cloudformation describe-stack-events \
            --stack-name product-assistant-cluster \
            --region ${{ secrets.AWS_REGION }}