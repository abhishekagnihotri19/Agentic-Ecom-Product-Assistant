name: Provision Infra (EKS + ECR)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  provision:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔍 Debug: List all files (check if template exists)
      - name: Check repository files
        run: ls -R

      # 🔐 Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 🔍 Debug: Verify AWS access
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🔍 Debug: Validate CloudFormation template
      - name: Validate CloudFormation Template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/eks-with-ecr.yaml

      # 🚀 Deploy Stack
      
      
      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name product-assistant-cluster \
            --template-file infra/eks-with-ecr.yaml \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ secrets.AWS_REGION }}

      - name: Check Stack Status
        run: |
          aws cloudformation describe-stacks \
            --stack-name product-assistant-cluster

      - name: Get Stack Events (IMPORTANT)
        run: |
          aws cloudformation describe-stack-events \
            --stack-name product-assistant-cluster

      - name: Check Stack Status
        run: aws cloudformation describe-stacks --stack-name product-assistant-cluster

      - name: Get Stack Events
        run: aws cloudformation describe-stack-events --stack-name product-assistant-cluster