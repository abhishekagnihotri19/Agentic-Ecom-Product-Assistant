services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp-server
    ports:
      - "8000:8000"
    environment:
      - ASTRA_DB_KEYSPACE=default_keyspace

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-app
    ports:
      - "8001:8001"
    depends_on:
      - mcp
    environment:
      - MCP_URL=http://mcp:8000/mcp
      - ASTRA_DB_KEYSPACE=default_keyspace